<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Dúplex manual">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e8e6"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#f6f5f4"/>

  <!-- printer body -->
  <rect x="24" y="42" width="80" height="44" rx="12" fill="#3584e4"/>
  <rect x="30" y="48" width="68" height="18" rx="6" fill="#62a0ea"/>

  <!-- top sheet -->
  <rect x="36" y="18" width="56" height="34" rx="6" fill="url(#paper)" stroke="#c0bfbc" stroke-width="2"/>
  <rect x="44" y="27" width="32" height="4" rx="2" fill="#9a9996"/>
  <rect x="44" y="35" width="24" height="4" rx="2" fill="#c0bfbc"/>

  <!-- output sheet -->
  <rect x="34" y="78" width="60" height="28" rx="6" fill="url(#paper)" stroke="#c0bfbc" stroke-width="2"/>
  <rect x="42" y="87" width="30" height="4" rx="2" fill="#9a9996"/>
  <rect x="42" y="95" width="22" height="4" rx="2" fill="#c0bfbc"/>

  <!-- status light -->
  <circle cx="90" cy="57" r="4" fill="#ffffff"/>

  <!-- duplex arrows -->
  <path d="M20 64c0-13 10-23 23-23" fill="none" stroke="#26a269" stroke-width="6" stroke-linecap="round"/>
  <path d="M39 35l8 6-10 4" fill="#26a269"/>

  <path d="M108 64c0 13-10 23-23 23" fill="none" stroke="#26a269" stroke-width="6" stroke-linecap="round"/>
  <path d="M89 93l-8-6 10-4" fill="#26a269"/>
</svg>
