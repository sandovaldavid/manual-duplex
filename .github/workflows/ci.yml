name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, py313, py314]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
          locked: true

      - name: Lint and test
        run: pixi run -e ${{ matrix.environment }} check
