[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "manual-duplex"
version = "0.1.0"
description = "Manual duplex printing for CUPS printers without automatic duplex support."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "David Sandoval" },
]
dependencies = [
  "pypdf>=6.19,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
manual-duplex = "manual_duplex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manual_duplex"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
